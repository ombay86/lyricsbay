<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricsBay Overlay</title>
  <!-- Google Fonts: Montserrat, Poppins, Inter, Bebas Neue, Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Poppins:wght@600;700;800;900&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --lyric-font: 'Montserrat', sans-serif;
      --active-font-size: 56px;
      --active-color: #FFFFFF;
      --inactive-opacity: 0.35;
      --stroke-color: #000000;
      --stroke-width: 2.2px;
      --glow-enabled: 1;
      --glow-color: #00d2ff;
      --vertical-position: 50; /* percentage: 50 = Center, 75 = Lower-Third */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      overflow: hidden;
      font-family: var(--lyric-font);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Viewport filling full screen with smooth top & bottom gradient mask */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: block;
      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.25) 8%,
        rgba(0, 0, 0, 1) 25%,
        rgba(0, 0, 0, 1) 75%,
        rgba(0, 0, 0, 0.25) 92%,
        rgba(0, 0, 0, 0) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.25) 8%,
        rgba(0, 0, 0, 1) 25%,
        rgba(0, 0, 0, 1) 75%,
        rgba(0, 0, 0, 0.25) 92%,
        rgba(0, 0, 0, 0) 100%
      );
    }

    /* Track anchored to top: 0 so active line can be scrolled to exact vertical target */
    .lyrics-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      will-change: transform, opacity;
    }

    .lyrics-track.blank {
      opacity: 0 !important;
    }

    /* Base Line Style - Uniform font size and scale so line counts NEVER change between waiting and active */
    .lyric-line {
      width: 100%;
      max-width: 1680px;
      text-align: center;
      padding: clamp(6px, 1.2vh, 14px) clamp(12px, 2vw, 36px);
      font-size: var(--active-font-size); /* SAMA PERSIS untuk semua baris */
      line-height: 1.3;
      font-weight: 700;
      color: var(--active-color);
      transition: opacity 0.35s ease, text-shadow 0.35s ease, -webkit-text-stroke 0.35s ease;
      opacity: 0; /* Hidden by default */
      -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
      text-shadow:
        0 0 16px rgba(0, 0, 0, 1),
        0 4px 10px rgba(0, 0, 0, 0.95),
        -2.5px -2.5px 0 var(--stroke-color),
        2.5px -2.5px 0 var(--stroke-color),
        -2.5px 2.5px 0 var(--stroke-color),
        2.5px 2.5px 0 var(--stroke-color);
      letter-spacing: 0.015em;
    }

    /* Active Line: 100% visible, highlighted with maximum weight, outline & glow */
    .lyric-line.active {
      opacity: 1 !important;
      font-size: var(--active-font-size); /* Ukuran tetap konsisten */
      font-weight: 900;
      color: var(--active-color);
      -webkit-text-stroke: calc(var(--stroke-width) * 1.15) var(--stroke-color);
      text-shadow:
        0 0 24px rgba(0, 0, 0, 1),
        0 6px 16px rgba(0, 0, 0, 1),
        -3px -3px 0 var(--stroke-color),
        3px -3px 0 var(--stroke-color),
        -3px 3px 0 var(--stroke-color),
        3px 3px 0 var(--stroke-color),
        0 0 calc(30px * var(--glow-enabled)) var(--glow-color);
    }

    /* 1 line away: Opacity meredup tapi ukuran & wrapping 100% sama */
    .lyric-line.dist-1 {
      opacity: var(--inactive-opacity) !important;
    }

    /* 2 lines away */
    .lyric-line.dist-2 {
      opacity: calc(var(--inactive-opacity) * 0.45) !important;
    }

    /* 3 lines away */
    .lyric-line.dist-3 {
      opacity: calc(var(--inactive-opacity) * 0.15) !important;
    }

    /* Far lines are completely invisible */
    .lyric-line.dist-far {
      opacity: 0 !important;
    }

    /* Section badges like [Chorus] or Verse */
    .lyric-line.is-tag {
      font-size: calc(var(--active-font-size) * 0.5);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FFD54F;
      -webkit-text-stroke: 1px var(--stroke-color);
      padding: 6px 0;
    }

    .lyric-line.is-tag.active {
      font-size: calc(var(--active-font-size) * 0.6);
      color: #FFE082;
      opacity: 1 !important;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="lyrics-track" id="track">
      <!-- Lyric lines rendered dynamically -->
    </div>
  </div>

  <script>
    let songs = [];
    let state = {
      currentSongIndex: 0,
      currentLineIndex: 0,
      isBlank: false,
      settings: {
        fontFamily: 'Montserrat',
        activeFontSize: 56,
        inactiveOpacity: 35,
        activeColor: '#FFFFFF',
        strokeColor: '#000000',
        strokeWidth: 2.2,
        glowEnabled: true,
        glowColor: '#00d2ff',
        verticalPosition: 50
      }
    };

    const track = document.getElementById('track');
    const root = document.documentElement;

    function applySettingsToCSS(settings) {
      if (!settings) return;
      if (settings.fontFamily) {
        root.style.setProperty('--lyric-font', `'${settings.fontFamily}', sans-serif`);
      }
      if (settings.activeFontSize) {
        // Adjust for viewport size
        const baseSize = settings.activeFontSize;
        root.style.setProperty('--active-font-size', `clamp(${Math.round(baseSize*0.45)}px, 3.4vw, ${baseSize}px)`);
      }
      if (settings.activeColor) {
        root.style.setProperty('--active-color', settings.activeColor);
      }
      if (typeof settings.inactiveOpacity === 'number') {
        root.style.setProperty('--inactive-opacity', (settings.inactiveOpacity / 100).toString());
      }
      if (settings.strokeColor) {
        root.style.setProperty('--stroke-color', settings.strokeColor);
      }
      if (typeof settings.strokeWidth === 'number') {
        root.style.setProperty('--stroke-width', `${settings.strokeWidth}px`);
      }
      if (typeof settings.glowEnabled === 'boolean') {
        root.style.setProperty('--glow-enabled', settings.glowEnabled ? '1' : '0');
      }
      if (settings.glowColor) {
        root.style.setProperty('--glow-color', settings.glowColor);
      }
      if (typeof settings.verticalPosition === 'number') {
        root.style.setProperty('--vertical-position', settings.verticalPosition.toString());
      }
    }

    function isTagLine(line) {
      if (!line) return false;
      const trimmed = line.trim();
      return (
        (trimmed.startsWith('[') && trimmed.endsWith(']')) ||
        /^Chorus|^Verse|^Bridge|^Intro|^Outro|^Repeat/i.test(trimmed)
      );
    }

    async function loadSongs() {
      try {
        const stateRes = await fetch('/api/state');
        state = await stateRes.json();

        if (state.settings) {
          applySettingsToCSS(state.settings);
        }

        const res = await fetch('/api/songs');
        if (res.ok) {
          songs = await res.json();
        }

        renderLyrics();
        void track.offsetHeight;
        updateDisplay();
      } catch (e) {
        console.error('Error loading songs or state:', e);
      }
    }

    function getCurrentSong() {
      if (state.currentSong && Array.isArray(state.currentSong.lines) && state.currentSong.lines.length > 0) {
        return state.currentSong;
      }
      if (songs && songs.length > 0) {
        if (state.currentSongId) {
          const found = songs.find(s => s.id === state.currentSongId);
          if (found) return found;
        }
        return songs[state.currentSongIndex || 0] || null;
      }
      return null;
    }

    function renderLyrics() {
      track.innerHTML = '';
      const currentSong = getCurrentSong();
      if (!currentSong || !currentSong.lines) return;

      currentSong.lines.forEach((lineText, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        if (isTagLine(lineText)) {
          div.classList.add('is-tag');
        }
        div.id = `line-${idx}`;
        div.textContent = lineText;
        track.appendChild(div);
      });
    }

    function updateDisplay() {
      const currentSong = getCurrentSong();
      if (!currentSong) return;

      if (state.isBlank) {
        track.classList.add('blank');
      } else {
        track.classList.remove('blank');
      }

      if (track.children.length === 0) {
        renderLyrics();
        void track.offsetHeight;
      }

      const lineElements = track.querySelectorAll('.lyric-line');
      const activeIdx = state.currentLineIndex;

      lineElements.forEach((el, idx) => {
        const diff = Math.abs(idx - activeIdx);
        const isTag = isTagLine(el.textContent);
        el.className = 'lyric-line' + (isTag ? ' is-tag' : '');

        if (idx === activeIdx) {
          el.classList.add('active');
        } else if (diff === 1) {
          el.classList.add('dist-1');
        } else if (diff === 2) {
          el.classList.add('dist-2');
        } else if (diff === 3) {
          el.classList.add('dist-3');
        } else {
          el.classList.add('dist-far');
        }
      });

      // Calculate vertical position based on verticalPosition setting (default 50% = center)
      const vertPct = (state.settings && typeof state.settings.verticalPosition === 'number') 
        ? state.settings.verticalPosition 
        : 50;

      const activeEl = document.getElementById(`line-${activeIdx}`);
      if (activeEl) {
        const lineCenter = activeEl.offsetTop + (activeEl.offsetHeight / 2);
        const targetScreenY = (window.innerHeight * vertPct) / 100;
        const targetY = targetScreenY - lineCenter;
        track.style.transform = `translateY(${targetY}px)`;
      }
    }

    function connectSSE() {
      const evtSource = new EventSource('/events');

      evtSource.onmessage = (e) => {
        try {
          const newState = JSON.parse(e.data);
          const songChanged = (newState.currentSongId && newState.currentSongId !== state.currentSongId) || 
                              (newState.currentSongIndex !== state.currentSongIndex) ||
                              (newState.currentSong && (!state.currentSong || newState.currentSong.id !== state.currentSong.id));
          
          if (newState.settings) {
            applySettingsToCSS(newState.settings);
          }

          state = newState;

          if (songChanged) {
            renderLyrics();
            void track.offsetHeight;
          }
          requestAnimationFrame(() => {
            updateDisplay();
          });
        } catch (err) {
          console.error('SSE parse error:', err);
        }
      };

      evtSource.onerror = () => {
        evtSource.close();
        setTimeout(connectSSE, 1500);
      };
    }

    if (document.fonts) {
      document.fonts.ready.then(() => {
        updateDisplay();
      });
    }

    window.addEventListener('resize', updateDisplay);

    loadSongs().then(() => {
      connectSSE();
    });
  </script>
</body>
</html>
